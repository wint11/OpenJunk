被撤稿的论文残骸，并从中提炼出新价值的“拾荒者”。
我们的核心理念包括：一、发现“负遗产”的价值： 承认失败的实验、被推翻的理论和尘封的文献并非无用之物，而是学术大厦不可或缺的基石。二、倡导“循环学术”： 鼓励对现有学术资源的深度挖掘与再利用，反对为了发表而制造的、空洞无物的“新概念”。三、致敬孤独的守望者： 为那些在冷门领域、交叉学科缝隙中坚持，或致力于修正、完善前人工作的学者提供一盏聚光灯。
奖项历史：从戏谑到庄严
起源（2020年）： 由几位青年学者在某次深夜学术吐槽中诞生。最初只是一个朋友圈的玩笑，用来调侃那些靠“炒冷饭”毕业的同窗。但随后他们发现，有些“冷饭”实则蕴含着被时代遗漏的黄金。
转型（2024年）： 随着学术不端事件的频发和对“论文工厂”产出的清理需求增加，奖项的定位发生转变。它不再仅仅是调侃，而是开始严肃地评选那些真正具备“拾荒”精神——即在清理学术垃圾、修正错误数据、从故纸堆中发现新线索方面做出贡献的研究。
确立（2026年）： 经过数年的非正式评选，《最佳拾荒者》逐渐在特定的学术圈层中获得认可。它设立了三项细分荣誉：“火眼金睛奖”（最佳数据纠错）、“点石成金奖”（最佳冷门文献再解读）、“废墟清道夫奖”（对学术过端或错误理论的清理贡献）。
奖项影响力：重塑学术的“暗物质”——《最佳拾荒者》的影响力不在于引领显学的潮流，而在于它深刻影响了学术界的 “自我净化”机制与“底层生态”。
一、为学术史提供新视角： 获奖作品往往揭示了科学发现背后被遮蔽的曲折路径。例如，2023年的获奖者通过梳理上世纪某本停刊杂志的读者来信，找到了一个被遗忘的、比正式发表论文早十年的原始构想。
二、促进科研资源的再利用： 奖项鼓励年轻学者不必盲目追热点，而是从庞大的、已发表但未被充分利用的学术存量中寻找突破口，极大地降低了低水平重复研究造成的“学术垃圾”产出。
三、构建学术界的“拾荒者社群”： 它联结了一群有耐心、有眼光的学者，他们不再视“垃圾”为耻辱，而是视其为未被开采的矿藏。这种风气正在潜移默化地改变博士生们的选题焦虑，让他们相信：最深刻的真理，往往藏在最不起眼的注脚里。"/><link rel="icon" href="/favicon.ico?favicon.0b3bf435.ico" sizes="256x256" type="image/x-icon"/><script src="/_next/static/chunks/a6dad97d9634a72d.js" noModule=""></script></head><body class="geist_a71539c9-module__T19VSG__variable geist_mono_8d43a2aa-module__8Li5zG__variable antialiased min-h-screen flex flex-col"><div hidden=""><!--$--><!--/$--></div><script>((a,b,c,d,e,f,g,h)=>{let i=document.documentElement,j=["light","dark"];function k(b){var c;(Array.isArray(a)?a:[a]).forEach(a=>{let c="class"===a,d=c&&f?e.map(a=>f[a]||a):e;c?(i.classList.remove(...d),i.classList.add(f&&f[b]?f[b]:b)):i.setAttribute(a,b)}),c=b,h&&j.includes(c)&&(i.style.colorScheme=c)}if(d)k(d);else try{let a=localStorage.getItem(b)||c,d=g&&"system"===a?window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light":a;k(d)}catch(a){}})("class","theme","system",null,["light","dark"],null,true,true)</script><header class="fixed top-0 z-50 w-full border-b bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/60"><div class="container mx-auto flex h-16 items-center"><a class="mr-6 flex items-center space-x-2" href="/"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash2 lucide-trash-2 h-6 w-6" aria-hidden="true"><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg><span class="hidden text-lg font-bold sm:inline-block">OpenJunk</span></a><nav class="hidden lg:flex items-center space-x-1 xl:space-x-4"><button type="button" id="radix-_R_1cdb_" aria-haspopup="menu" aria-expanded="false" data-state="closed" data-slot="dropdown-menu-trigger" class="flex items-center px-2 py- t\":\"card-title\",\"className\":\"font-semibold text-lg flex items-center gap-2\",\"children\":[[\"$\",\"svg\",null,{\"ref\":\"$undefined\",\"xmlns\":\"http://www.w3.org/2000/svg\",\"width\":24,\"height\":24,\"viewBox\":\"0 0 24 24\",\"fill\":\"none\",\"stroke\":\"currentColor\",\"strokeWidth\":2,\"strokeLinecap\":\"round\",\"strokeLinejoin\":\"round\",\"className\":\"lucide lucide-calendar h-5 w-5\",\"aria-hidden\":\"true\",\"children\":[[\"$\",\"path\",\"1cmpym\",{\"d\":\"M8 2v4\"}],[\"$\",\"path\",\"4m81vk\",{\"d\":\"M16 2v4\"}],[\"$\",\"rect\",\"1hopcy\",{\"width\":\"18\",\"height\":\"18\",\"x\":\"3\",\"y\":\"4\",\"rx\":\"2\"}],[\"$\",\"path\",\"8toen8\",{\"d\":\"M3 10h18\"}],\"$undefined\"]}],\"历史周期\"]}]}],[\"$\",\"div\",null,{\"data-slot\":\"card-content\",\"className\":\"px-6\",\"children\":[\"$\",\"p\",null,{\"className\":\"text-muted-foreground\",\"children\":\"暂无历史周期\"}]}]]}]\n22:T1231,"])</script><script>self.__next_f.push([1,"一、 核心评审理念\r\n本奖项不追求“引用率最高”或“话题性最强”，而是寻找那些在学术研究中展现出独特视角、非凡耐心与诚实劳作的作品。我们相信，真正的学术贡献有时不在于建造了多少空中楼阁，而在于为摇摇欲坠的地基填补了多少坚实的砖石。\r\n二、 参评资格\r\n成果类型： 已正式发表的期刊论文、学位论文、学术专著、勘误与评论、数据集整理、文献索引汇编等任何形式的学术产出。\r\n时间范围： 过去3年内发表或完成的作品。\r\n学科领域： 不限学科，人文社科与自然科学均可申报。\r\n申报方式： 实行“本人申报”与“同行提名”相结合的制度。特别鼓励“被遗忘的作者”或“冷门领域的坚守者”自行申报。\r\n三、 评选维度（满分100分）\r\n本奖项设立四个评选维度，从不同侧面考察参选作品的“拾荒者精神”。\r\n1. 拾荒对象的价值潜力（30分）\r\n考察参选者选择处理的“学术垃圾”本身是否具备被忽视的潜在价值。\r\nA类：尘封的富矿（26-30分） 处理对象为具有重要学术潜力但被遗忘超过20年的文献、数据或理论；或是对某一学科领域奠基性但被误读的经典文本的再解读。\r\nB类：被遮蔽的珍珠（21-25分） 处理对象为曾因发表平台边缘、语种小众、观点超前而被忽略的有价值研究（被忽视5年以上）。\r\nC类：当下的废墟（16-20分） 处理对象为近期（5年内）但已被证明有重大瑕疵或需要补充验证的热点研究。\r\nD类：普通的垃圾（0-15分） 处理对象本身价值有限，仅为低水平重复或明显无意义的产出。\r\n2. 拾荒工作的难度与技艺（30分）\r\n考察为了从“垃圾”中提炼价值，参选者所付出的智识努力与技术难度。\r\n考古级挖掘（26-30分） 需要借助罕见语种、跨学科知识、复杂的技术手段（如古籍修复、原始实验数据重建、大规模文献溯源）才能完成的工作。\r\n深巷级探索（21-25分） 需要查阅大量非数字化文献、田野调查、访谈关键人物，或进行复杂的数据清洗与比对。\r\n地表级清理（16-20分） 主要依靠现有数据库和常规学术能力即可完成的梳理与纠错。\r\n随手级拾取（0-15分） 工作难度较低，主要依赖偶然发现或常规检索。\r\n3. 成果的启发性与贡献度（25分）\r\n考察“变废为宝”后，对学术界产生的实际影响。\r\n范式启示（22-25分） 成果可能引发对某一学科领域基础假设的反思，或开辟了全新的研究方向。\r\n重要补充（18-21分） 成果对现有主流理论或重要研究进行了关键性的修正、补充，使其更为严谨。\r\n局部纠错（14-17分） 成果纠正了具体的数据错误、事实谬误或翻译偏差，具有实质性的学术价值。\r\n知识普及（0-13分） 成果主要为知识的梳理与介绍，启发性有限。\r\n4. 拾荒者的身份与姿态（15分）\r\n这是一个带有价值观色彩的加分项，考察参选者在这一劳作中体现的学术品格。\r\n孤独的清道夫（13-15分） 在无人关注的领域长期耕耘，且成果发表后未获得与贡献相匹配的关注度，但依然坚持。\r\n勇敢的纠错者（10-12分） 挑战权威或纠正广为流传的错误，即使可能面临争议或阻力。\r\n谦逊的修补匠（6-9分） 默默地为学术大厦添砖加瓦，态度诚恳，不夸大自己的贡献。\r\n投机的拾荒者（0-5分） 拾荒行为主要为了迎合某种潮流或快速发表，缺乏真正的学术诚意。\r\n四、 评审流程\r\n提名/申报阶段： 开放线上申报平台，接受全球学者的自荐或推荐。需提交成果原文及一篇《拾荒者手记》（1000字以内），阐述发现与挖掘的过程。\r\n初筛阶段： 由学术秘书处根据“拾荒对象的价值潜力”和“拾荒工作的难度”两项得分，筛选出入围作品（约10-15项）。\r\n终审阶段： 由跨学科评审委员会进行独立打分。评审过程采用“双盲”与“开放辩论”相结合的方式，确保对“启发性”的评判尽可能客观。\r\n实地核查（抽查）： 对于有重大争议或需要验证的挖掘过程，评委会保留委托第三方进行学术溯源核查的权利。\r\n五、 特别说明\r\n拒绝“凡尔赛”式拾荒： 本奖项拒绝那些本已处于学术中心、却以猎奇心态“俯视”边缘领域，并将其作为个人传奇点缀的申报者。拾荒者应是真正的参与者，而非观光客。"])</script><script>self.__next_f.push([1,"1f:[\"$\",\"$L1c\",null,{\"value\":\"criteria\",\"className\":\"mt-6\",\"children\":[\"$\",\"div\",null,{\"data-slot\":\"card\",\"className\":\"bg-card text-card-foreground flex flex-col gap-6 rounded-xl border py-6 shadow-sm\",\"children\":[[\"$\",\"div\",null,{\"data-slot\":\"card-header\",\"className\":\"@container/card-header grid auto-rows-min grid-rows-[auto_auto] items-start gap-2 px-6 has-data-[slot=card-action]:grid-cols-[1fr_auto] [.border-b]:pb-6\",\"children\":[\"$\",\"div\",null,{\"data-slot\":\"card-title\",\"className\":\"font-semibold text-lg flex items-center gap-2\",\"children\":[[\"$\",\"svg\",null,{\"ref\":\"$undefined\",\"xmlns\":\"http://www.w3.org/2000/svg\",\"width\":24,\"height\":24,\"viewBox\":\"0 0 24 24\",\"fill\":\"none\",\"stroke\":\"currentColor\",\"strokeWidth\":2,\"strokeLinecap\":\"round\",\"strokeLinejoin\":\"round\",\"className\":\"lucide lucide-clipboard-list h-5 w-5\",\"aria-hidden\":\"true\",\"children\":[[\"$\",\"rect\",\"tgr4d6\",{\"width\":\"8\",\"height\":\"4\",\"x\":\"8\",\"y\":\"2\",\"rx\":\"1\",\"ry\":\"1\"}],[\"$\",\"path\",\"116196\",{\"d\":\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\"}],[\"$\",\"path\",\"1jrz19\",{\"d\":\"M12 11h4\"}],[\"$\",\"path\",\"n85exb\",{\"d\":\"M12 16h4\"}],[\"$\",\"path\",\"1dfujw\",{\"d\":\"M8 11h.01\"}],[\"$\",\"path\",\"18s6g9\",{\"d\":\"M8 16h.01\"}],\"$undefined\"]}],\"评选标准\"]}]}],[\"$\",\"div\",null,{\"data-slot\":\"card-content\",\"className\":\"px-6\",\"children\":[\"$\",\"div\",null,{\"className\":\"prose max-w-none text-muted-foreground leading-relaxed whitespace-pre-wrap\",\"children\":\"$22\"}]}]]}]}]\n"])</script><script>self.__next_f.push([1,"23:Tbb4,作为学术界的“二次勘探”奖，我们的奖项宗旨是：在废墟中打捞未来。我们致力于表彰那些在学术研究的“边缘地带”与“废弃矿区”默默耕耘的学者。当主流学界热衷于追逐显学的高峰时，我们致敬那些愿意俯身拾起被遗忘的数据、被忽视的档案、被废弃的假设以及被撤稿的论文残骸，并从中提炼出新价值的“拾荒者”。\r\n我们的核心理念包括：一、发现“负遗产”的价值： 承认失败的实验、被推翻的理论和尘封的文献并非无用之物，而是学术大厦不可或缺的基石。二、倡导“循环学术”： 鼓励对现有学术资源的深度挖掘与再利用，反对为了发表而制造的、空洞无物的“新概念”。三、致敬孤独的守望者： 为那些在冷门领域、交叉学科缝隙中坚持，或致力于修正、完善前人工作的学者提供一盏聚光灯。\r\n奖项历史：从戏谑到庄严\r\n起源（2020年）： 由几位青年学者在某次深夜学术吐槽中诞生。最初只是一个朋友圈的玩笑，用来调侃那些靠“炒冷饭”毕业的同窗。但随后他们发现，有些“冷饭”实则蕴含着被时代遗漏的黄金。\r\n转型（2024年）： 随着学术不端事件的频发和对“论文工厂”产出的清理需求增加，奖项的定位发生转变。它不再仅仅是调侃，而是开始严肃地评选那些真正具备“拾荒”精神——即在清理学术垃圾、修正错误数据、从故纸堆中发现新线索方面做出贡献的研究。\r\n确立（2026年）： 经过数年的非正式评选，《最佳拾荒者》逐渐在特定的学术圈层中获得认可。它设立了三项细分荣誉：“火眼金睛奖”（最佳数据纠错）、“点石成金奖”（最佳冷门文献再解读）、“废墟清道夫奖”（对学术过端或错误理论的清理贡献）。\r\n奖项影响力：重塑学术的“暗物质”——《最佳拾荒者》的影响力不在于引领显学的潮流，而在于它深刻影响了学术界的 “自我净化”机制与“底层生态”。\r\n一、为学术史提供新视角： 获奖作品往往揭示了科学发现背后被遮蔽的曲折路径。例如，2023年的获奖者通过梳理上世纪某本停刊杂志的读者来信，找到了一个被遗忘的、比正式发表论文早十年的原始构想。\r\n二、促进科研资源的再利用： 奖项鼓励年轻学者不必盲目追热点，而是从庞大的、已发表但未被充分利用的学术存量中寻找突破口，极大地降低了低水平重复研究造成的“学术垃圾”产出。\r\n三、构建学术界的“拾荒者社群”： 它联结了一群有耐心、有眼光的学者，他们不再视“垃圾”为耻辱，而是视其为未被开采的矿藏。这种风气正在潜移默化地改变博士生们的选题焦虑，让他们相信：最深刻的真理，往往藏在最不起眼的注脚里。20:[\"$\",\"$L1c\",null,{\"value\":\"intro\",\"className\":\"mt-6\",\"children\":[\"$\",\"div\",null,{\"data-slot\":\"card\",\"className\":\"bg-card text-card-foreground flex flex-col gap-6 rounded-xl border py-6 shadow-sm\",\"children\":[[\"$\",\"div\",null,{\"data-slot\":\"card-header\",\"className\":\"@container/card-header grid auto-rows-min grid-rows-[auto_auto] items-start gap-2 px-6 has-data-[slot=card-action]:grid-cols-[1fr_auto] [.border-b]:pb-6\",\"children\":[\"$\",
