              \u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"48\" height=\"48\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"mb-4 opacity-50\"\u003e\u003cpath d=\"M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z\"/\u003e\u003cpolyline points=\"14 2 14 8 20 8\"/\u003e\u003cline x1=\"12\" x2=\"12\" y1=\"18\" y2=\"18\"/\u003e\u003c/svg\u003e\n                            \u003cp\u003e该期刊暂无已发表论文\u003c/p\u003e\n                        \u003c/div\u003e\n                    {{/if}}\n                \u003c/div\u003e\n            \u003c/main\u003e\n        \u003c/div\u003e\n    \u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[\"$\",\"$L16\",null,{\"code\":\"$17\",\"data\":{\"name\":\"痔 PilesStudies\",\"description\":\"痔理之道，就在其中。\\r\\n——政管一《痔》以蔽之\",\"paperCount\":5,\"adminCount\":0,\"createdAt\":\"2026/3/8\",\"guidelines\":\"来稿请投邮箱 pilesstudies@126.com\\r\\n或xhs搜索本刊账号【掷Throw】私信发送\",\"guidelinesUrl\":null,\"papers\":[{\"id\":\"cmmo3j9us000j4k4e9dyyn988\",\"title\":\"Lighter-Biting as a Rational Choice: A Quantitative Reassessment of Strategic Performance Art in the Era of Huo-er Deficiency\",\"description\":\"摘要：国际政治表演艺术领域长期受困于一种顽固且理论化不足的症候——\\\"活儿\\\"的严重匮乏。这个东北方言词汇意指实质性的表演内容，坊间常以\\\"拉胯\\\"（字面意为\\\"拖垮胯骨\\\"）指代。现有文献虽已广泛记载\\\"活儿\\\"稀缺所引发的系统性影响，但具体行为反应背后的策略性考量却始终未获充分检视。本文通过构建严谨的成本收益分析框架，填补了这一研究空白，旨在评估在\\\"活儿\\\"极端匮乏状态下，将\\\"咬打火机\\\"作为外交政策工具的可行性。基于对沈阳街头案例库（1998年至今）的民族志研究，我们设定了关键变量，包括现场时段封锁时长、罚款金额，以及点火装置永久性消失。研究结果表明，尽管\\\"咬打火机\\\"需承担明确负面效用——如30天现场时段封锁、逾700美元罚款及点火装置永久消失——却意外催生了当代表演艺术话语中日益被推崇的\\\"鸡毛获取不能\\\"状态。通过对47起有记录的咬打火机事件数据集进行多元回归分析，我们证实当\\\"活儿\\\"供给低于区域均值0.35个标准差时，咬打火机的效用计算会果断倾向有利一方。我们还考察了其他政策干预选项——包括额头开润滑油罐、裤裆燃放烟花、以及执行空中旋转动作——发现无一能实现咬打火机方案所特有的成本信号与利益阻断的独特平衡。结论指出，对于面临生存级\\\"活儿\\\"危机的国家（或类国家表演实体），在晚期表演艺术治理的受限选择集中，咬打火机不仅是一种可行的战略选项，更是一项帕累托最优响应。\\r\\n关键词：东北表演艺术，战略性咬打火机，活儿匮乏，成本收益分析，沈阳街头范式，鸡毛获取不能\",\"author\":\"痔 PilesStudies主编\",\"date\":\"2026/3/28\",\"category\":\"政治学、国际政治\"},{\"id\":\"cmmo48jtz000r4k4ekviboyiy\",\"title\":\"道在屎溺，鱼在隔间：劳动空间中的厕所正痔学\",\"description\":\"摘要：本文研究了当代打工人如何在厕所里合法摸鱼。通过在深圳某公司三个月的带薪如厕观察，发现厕所已从\\\"解决问题的地方\\\"升级为\\\"逃避问题的地方\\\"。研究证实：智能马桶盖能显著提升员工对公司的昧心好评，而隔间门则是对抗老板监控的最后一道物理防线。本文提出的\\\"厕所摸鱼\\\"概念，为劳动社会学开辟了极具气味的新领域。\\r\\n关键词：带薪如厕；隔间政治学；摸鱼人类学；肥水不流外人田\",\"author\":\"痔 PilesStudies主编\",\"date\":\"2026/3/26\",\"category\":\"政治学、传播学\"},{\"id\":\"cmmo45cmo000n4k4e02gk608q\",\"title\":\"街角症痔：生瓜蛋子视角下华强与郝哥的权力博弈\",\"description\":\"摘要：网络语境下“华强买瓜”的场景，可视为一场在街角发生的抽象权力展演。本文以生瓜蛋子为叙事视角，剖析华强与郝哥间的权力博弈逻辑，将二者的权力互动类比为“症痔”的淤积与伪消解，结合武力霸权、伪善表演、符号异化等视角，揭示网络抽象场域中权力运作的荒诞性。\\r\\n关键词：街角症痔；生瓜蛋子；华强；郝哥；权力博弈\",\"author\":\"痔 PilesStudies主编\",\"date\":\"2026/3/26\",\"category\":\"政治学\"},{\"id\":\"cmmn88sju000uf5vwdid8sa3a\",\"title\":\"无为而痔：公共治理隐喻与身体政治的现代阐释\",\"description\":\"摘要：本文以中国传统治理思想“无为而治”为理论起点，通过谐音转义与政治隐喻分析，创造性提出“无为而痔”这一兼具身体性与政治性的核心概念。文章将肛肠健康问题转化为公共治理隐喻，指出：过度干预、强行发力、形式主义、高压内卷等“有为式治理”，不仅会导致社会运行失序，亦会在个体身体层面形成“大痔”式病灶。研究认为，真正的良政善治，应回归“不妄为、不折腾、不内耗”的无为智慧，实现国家“大治”与个体“无痔”的双重统一。\\r\\n关键词：无为而治；无为而痔；身体政治；公共治理；治理隐喻；内卷化\",\"author\":\"痔 PilesStudies主编\",\"date\":\"2026/3/23\",\"category\":\"政治学、哲学\"},{\"id\":\"cmmo51gxp000v4k4e73hfpm2m\",\"title\":\"排泄物的科层制：论《构石》中的工具理性回潮与批评者的自我共谋\",\"description\":\"摘要：以《构石》（S.H.I.T.）为代表的学术整活刊物，常被视为东亚高压学术体制下的一次达达主义（Dadaism）突围。然而，本文通过对该刊物的文本分析与社区治理逻辑考察，指出其本质并非对学术权力的解构，而是工具理性对排泄领域的深度殖民。这种反叛呈现出一种典型的“宋江式招安情结”：通过对学术八股（格式）的恋物癖式模仿，行动者试图在主流评价体系之外，重建一个镜像的权力金字塔。这并非权力的真空，而是权力的“代偿性假肢”。\\r\\n关键词：构石；工具理性；格式恋物癖；招安情结；景观社会\",\"author\":\"痔 PilesStudies主编\",\"date\":\"2026/3/23\",\"category\":\"政治学、哲学\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[97291,[\"/OpenJunk/_next/static/chunks/fb2ff57bae076136.js\",\"/OpenJunk/_next/static/chunks/c022a629a3161d5a.js\"],\"IconMark\"]\n10
