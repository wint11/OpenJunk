那些伟大的意外。\",\"paperCount\":4,\"adminCount\":0,\"createdAt\":\"2026/2/21\",\"guidelines\":\"投稿与反馈机制 (Submission \u0026 \\\"Peer Review\\\")\\r\\n本刊审稿过程极具随机性，模拟大脑神经元的突触传递：\\r\\n\\r\\n投稿地址：官方邮箱 526415755@qq.com。\\r\\n\\r\\n同步收录：如果你已经在 @OpenJunk 或 @Web of Nothing 的深渊里挣扎，我们将自动同步你的痛苦。\\r\\n\\r\\n即时交流：欢迎加入小红书交流群。那里没有审稿人，只有一群同样因为“物体离奇失踪”而怀疑人生的同行。\\r\\n\\r\\n\\r\\n\",\"guidelinesUrl\":null,\"papers\":[{\"id\":\"cmmeqauos00674tccxmkapq1r\",\"title\":\"必须旗帜鲜明地反对“病理性突触修剪”！\",\"description\":\"近期，因本刊家族“放电频率”过载，意外触发了某平台算法的“抑制性突触后电位\\r\\n（IPSP）”，导致我们这个专为神经科学同仁提供多巴胺的“默认网络”遭遇了无差别\\r\\n的“病理性突触修剪”。面对这种缺乏幽默感的封杀，《Rubbish Neurology》绝不会发\\r\\n生“细胞凋亡”。凭借强大的“神经可塑性”，我们正积极建立新的“侧支循环”，跨\\r\\n越这道不解风情的“血脑屏障”，前往其他“脑区”继续为大家稳定分泌“神经营养因\\r\\n子”。突触重建中，快乐不阻断。\\r\\n\",\"author\":\"Rubbish Neurology主编\",\"date\":\"2026/3/29\",\"category\":\"神经科学\"},{\"id\":\"cmlxtckh00026pbh0xoolsexu\",\"title\":\"“我就在你眼皮底下看到的”：母性介入引发的 子代视觉皮层现实重构与维度坍缩\",\"description\":\"家政空间物理学长期受困于“物体离奇失踪”这一非线性扰动。本研究通过对 500 个\\r\\n混乱卧室的随机双盲监控发现，家中的杂物（如单只袜子、高中毕业证、指甲刀）并\\r\\n非处于宏观静止态，而是与母亲的视网膜存在非定域性量子纠缠。当非母系个体执行\\r\\n搜索指令时，物体处于“高维概率云”中（即：找死也找不到）；而一旦母系个体发出\\r\\n观测指令或进入该场域，波函数瞬间坍缩，物体在 0.01 秒内完成具象化。\\r\\n\",\"author\":\"Rubbish Neurology主编\",\"date\":\"2026/3/22\",\"category\":\"神经科学\"},{\"id\":\"cmm7y2olq002ubf2o77v79o37\",\"title\":\"由特定声频激发的侵入式神经约束装置—— “紧箍咒”诱发齐天大圣头痛的神经生理学机制研究\",\"description\":\"本文针对《西游记》中记载的“紧箍咒”现象，通过跨学科建模，探讨了唐僧诵经声波如何通过物理-电信号转换诱发孙悟空（受试者 A）剧烈头痛的机制。研究发现，紧箍并非单纯物理刑具，而是一种高集成的生物电子约束装置。该装置通过识别特定频率的声学编码，产生径向收缩力，并同步向大脑皮层发放高频电刺激，激活三叉神经血管系统，导致受试者产生极端的偏头痛样发作。本文进一步分析了受试者成佛后该装置自动失效的神经反馈机制。\\r\\n\",\"author\":\"匿名作者\",\"date\":\"2026/3/19\",\"category\":\"神经科学\"},{\"id\":\"cmmdku35x002b4tccoutluvfp\",\"title\":\"美颜相机过度磨皮与人类审美疲劳的神经美学 研究——基于 fMRI 的伏隔核激活度倒 U 型曲线 与恐怖谷效应的实证分析\",\"description\":\"目的：探讨移动端美颜相机中“磨皮”功能的参数设置对人脸审美加工神经机制的影\\r\\n响，特别是过度磨皮是否触发大脑“恐怖谷”效应，导致审美愉悦转为负面情绪。方\\r\\n法：招募 30 名 18 30 岁女性被试，采用 3T 功能磁共振成像技术，测量被试在观看不\\r\\n同磨皮程度（0%、30%、60%、90%）的自摄面孔及他人面孔照片时，大脑奖赏中枢\\r\\n伏隔核与厌恶情绪中枢杏仁核的血氧水平依赖信号变化。结果：研究发现，伏隔核激\\r\\n活度随磨皮程度增加呈倒 U 型曲线变化，在 30% 50% 区间达到峰值，超过 70% 后急\\r\\n剧下降（F(3,87)=12.47, p\u003c0.001, š=0.30）；杏仁核激活度在磨皮程度超过 70% 后显著\\r\\n上升，与 90% 磨皮面孔呈现正相关（r=0.62, p\u003c0.01）；事后分析发现，过度磨皮面孔\\r\\n（90%）诱发的神经反应模式与恐怖谷理论中“似人非人”刺激物（如高度拟真机器人）\\r\\n具有相似性。结论：适度美颜提升审美愉悦，过度磨皮触发大脑“虚假警报”，导致审\\r\\n美疲劳与厌恶情绪。研究结果为美颜 APP 参数优化提供神经美学依据，建议将“一键\\r\\n变外星人”模式设置为付费解锁功能以降低用户心理伤害。\\r\\n\",\"author\":\"Rubbish Neurology主编\",\"date\":\"2026/3/12\",\"category\":\"神经科学\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[97291,[\"/_next/static/chunks/fb2ff57bae076136.js\",\"/_next/static/chunks/c022a629a3161d5a.js\"],\"IconMark\"]\n10:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Rubbish Neurology - OpenJunk\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"如果你的实验结果逻辑严密且完全符合预期，请投递给 Nature 或 Science。\\r\\n\\r\\n《Rubbish Neurology》只在乎那些伟大的意外。\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"3\",{}]]\n"])</script></body></html>
