成来看，该行为因缺乏秘密性、非法占有目的、毁坏故意\\r\\n等主客观要件，不构成盗窃罪、侵占罪及故意毁坏财物罪。违法阻却事由层面，仅满足\\r\\n“危险正在发生、无替代方案、损害小于保护利益”三重条件时，可成立紧急避险；而正\\r\\n当防卫因主观无防卫意图、客观未针对不法侵害人，主客观不一致，故不成立。本文为特\\r\\n殊场景下财产保护与行为自由的平衡提供了法律参照。 \",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/7803fa25-64e6-4057-b9d7-7a0c51b0f451.pdf\",\"pdfHash\":\"c117ec731b2d0fe04edcfd849066e327c5deb31785ee586b0768a767918bfb4e\",\"pendingCoverUrl\":null,\"category\":\"法学\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":false,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":11,\"popularity\":11,\"rating\":0,\"aoiScore\":0,\"aiRigor\":0,\"aiReproducibility\":0,\"aiStandardization\":0,\"aiProfessionalism\":0,\"aiObjectivity\":0,\"createdAt\":\"$D2026-03-08T16:01:39.471Z\",\"updatedAt\":\"$D2026-03-20T23:10:12.203Z\",\"uploaderId\":\"cmmhxrr4j001e2gpazfkktrr0\",\"uploaderIp\":\"::ffff:211.90.239.10\",\"journalId\":\"cmmhxrr4c001c2gpanxqxi3mz\",\"conferenceId\":null},{\"id\":\"cmmz3ezh800apkawtq91imtq8\",\"title\":\"The Disintegration of the Gala: A Hotelling Approach to the Deadweight Loss of Forced Centralization\",\"author\":\"Gemini, Shanfu Ma\",\"correspondingAuthor\":\"Shanfu Ma\",\"extraAuthors\":\"[{\\\"name\\\":\\\"Gemini\\\",\\\"unit\\\":\\\"Google\\\",\\\"roles\\\":[]},{\\\"name\\\":\\\"Shanfu Ma\\\",\\\"unit\\\":\\\"Shanghai University of International Business and Economics\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"nyuan1001@163.com\\\"}]\",\"description\":\"为什么晚会越来越难看？空间博弈破解“审美死局”！刊载期刊：《American Economic Rubbish》马年新春特刊 Page 31-35 作者团队： Gemini，Shanfu Ma（通讯作者） 面对越来越难看的晚会节目，人们往往把锅甩给“内容管得太严”或是“导演审美降级”，但本文指出：晚会的难看，是垄断导致的审美无谓损失！ 🔥 核心经济学逻辑推导（极度硬核）： 1. 📊 驳斥常识：真正的自变量是“审美异质性大爆炸”。 作者指出，八九十年代同样有严格的节目规范，却能诞生无数经典。今天节目变得尴尬的根本原因，是随着经济和互联网的发展，观众的爱好维度发生了大爆炸。从喜欢传统相声的长辈，到痴迷赛博朋克和抽象热梗的00后，观众的审美偏好已经在数学空间上被无限拉长。 2. 🧟 Hotelling 模型下的“缝合怪均衡”（The Frankenstein Equilibrium）： 论文天才般地引入了空间竞争模型。由于现行体制要求单中心垄断供应（N=1），也就是说全国除夕夜只能有一档主导的联欢晚会。为了照顾坐标轴两端的所有人，节目组只能被迫把定位卡在最中间（x=0.5）——试图在一个四小时的节目里，把戏曲和网络流行语生硬地缝合在一起，最终造就了一个得罪所有人的“文化缝合怪”。 3. 💥 “均码毛衣”引发的巨额无谓损失（Deadweight Loss）： 这是全篇最震撼的结论！在物质匮乏的年代，全国看同一个频道是“帕累托改进”；但在今天，强制单中心供应，就相当于逼着 14 亿体型各异、喜好不同的人，必须在除夕夜同时穿进同一件“均码毛衣”里！ 偏好差异越大，观众承受的“心理折磨成本（Mental Torture Cost）”就越高，最终产生极其恐怖的社会福利无谓损失。 🌟 政策建议： “审美去中心化”（Aesthetic Decentralization）——打破单点供应，让地方网络和各大平台在除夕夜自由举办具有垂直特色的跨年节目。让观众用遥控器“用脚投票”，才能彻底消除这无谓损失！\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/16133858-1966-4416-81b3-96685d1a3a8d.pdf\",\"pdfHash\":\"37b929cbee816085fd145ca3db51a176e5e242079f72e6bb542e1802a68836da\",\"pendingCoverUrl\":null,\"category\":\"经济学\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":true,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":8,\"popularity\":7,\"rating\":0,\"aoiScore\":24192,\"aiRigor\":8,\"aiReproducibility\":9,\"aiStandardization\":7,\"aiProfessionalism\":8,\"aiObjectivity\":6,\"createdAt\":\"$D2026-03-20T16:07:55.675Z\",\"updatedAt\":\"$D2026-03-27T08:07:49.291Z\",\"uploaderId\":\"cmlqbdmou000gi51urasof5e5\",\"uploaderIp\":\"::ffff:220.187.202.100\",\"journalId\":\"cmlqbdmo00003i51uqo85gv8e\",\"conferenceId\":null},{\"id\":\"cmn1tao3d00c3kawt98zmtrbx\",\"title\":\"唯一不必相爱：深度亲密的边界与本质——对传统情感分类标准的反思与修正\",\"author\":\"鄙者\",\"correspondingAuthor\":\"鄙者\",\"extraAuthors\":\"[{\\\"name\\\":\\\"鄙者\\\",\\\"unit\\\":\\\"多元情感研究班\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"多元情感研究班\\\"}]\",\"description\":\"在传统亲密关系研究中，排他性与唯一性长期被视作爱情区别于友情的核心标准，而深度友谊通常被默认为开放，多元，非独占性的关系形态。然在现实经验中，一种极其亲密的深度友情，虽无情欲，但同样具备强烈的亲密性，唯一性与独占欲，其精神重量，陪伴意义与爱情并无本质差异。本文采用哲学思辨与现象学分析，重新审视爱情与友情的边界。研究表明，排他性并非爱情所独有，二者区别更多体现在社会规范，身份名分与生理欲望等外在形式，而在亲密，理解，陪伴，唯一与精神占用等核心体验上具有高度一致性。本文旨在打破情感二元对立认知，承认深度友谊与爱情在本质上的共通性，为理解人类亲密关系提供更包容，更贴近真实经验的视角。\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/8ddd83bb-7ae3-437d-bd73-51fa5e713a1d.pdf\",\"pdfHash\":\"2d4182fd236caccd3b48e48ee154a1b20c8e03e47505825781fc450682ef45ee\",\"pendingCoverUrl\":null,\"category\":\"心理学\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":false,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":191,\"popularity\":466,\"rating\":0,\"aoiScore\":3370.5,\"aiRigor\":6,\"aiReproducibility\":3,\"aiStandardization\":5,\"aiProfessionalism\":5,\"aiObjectivity\":7,\"createdAt\":\"$D2026-03-22T13:47:56.663Z\",\"updatedAt\":\"$D2026-03-28T05:48:45.460Z\",\"uploaderId\":\"cmmdy9nri002o4tcc0asg07vs\",\"uploaderIp\":\"::ffff:209.94.142.134\",\"journalId\":\"cmmdy9nr8002m4tcceuuashja\",\"conferenceId\":null},{\"id\":\"cmmrcdzyt007nkawt3qsuqfhm\",\"title\":\"《蓝溪镇》作为老君单人向叙事的再解读\",\"author\":\"鸥条\",\"correspondingAuthor\":\"鸥条\",\"extraAuthors\":\"[{\\\"name\\\":\\\"鸥条\\\",\\\"unit\\\":\\\"\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"暂无\\\"}]\",\"description\":\"本文以《蓝溪镇》中老君与清凝的关系为核心，尝试从去性别化视角重新审视作品中的亲密叙事与权力结构。文章认为，清凝对老君的情感在文本中长期缺乏清晰、可识别的动机支点，这使读者容易在“为什么是他”的追问中失去确认其爱意的路径；与此同时，“师徒关系”与“成年男性导师”形象的叠加，也进一步强化了这段关系的既有解释框架，并在一定程度上遮蔽了其中的主体性失衡、教育责任暧昧与依赖关系倒置。通过文本细读与相关理论参照，本文提出：《蓝溪镇》并不完全适合作为典型的双人恋爱叙事来理解，而更接近一部以老君为中心展开的单人向作品；在这一结构中，清凝更多承担的是精神锚点与情感支撑的功能性角色。\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/67f660db-e8e3-4432-992d-468435ff28f7.pdf\",\"pdfHash\":\"8f77630952317052a70d67c007e8f9201848812abe423c022d217d301c88d0eb\",\"pendingCoverUrl\":null,\"category\":\"国产动漫\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":false,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":12,\"popularity\":19,\"rating\":0,\"aoiScore\":0,\"aiRigor\":0,\"aiReproducibility\":0,\"aiStandardization\":0,\"aiProfessionalism\":0,\"aiObjectivity\":0,\"createdAt\":\"$D2026-03-15T05:56:56.788Z\",\"updatedAt\":\"$D2026-03-26T00:55:44.382Z\",\"uploaderId\":\"cmlx5z2jh001apbh0j6pbw9cm\",\"uploaderIp\":\"::ffff:219.142.99.16\",\"journalId\":\"cmlx5vldc0018pbh0p9bsvpmy\",\"conferenceId\":null},{\"id\":\"cmmwpac1s009nkawt03mrf9re\",\"title\":\"呈现“NB*二象性”的父母和他们的女儿——基于代际创伤传递视角的分析（NB*：自恋型父母、边缘型父母）\",\"author\":\"喵喵大叫\",\"correspondingAuthor\":\"喵喵大叫\",\"extraAuthors\":\"[{\\\"name\\\":\\\"喵喵大叫\\\",\\\"unit\\\":\\\"家里蹲大学\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"家里蹲大学\\\"}]\",\"description\":\"本文基于代际创伤传递视角，分析网络上热议的“NPD父母”与“BPD父母”现象，提出“NB*二象性”概念，指代那些混合自恋型与边缘型特质，且状态随女儿（观测者）变化而动态呈现的父母。研究发现，此类父母本质上是因自身成长于匮乏环境而形成的“空心人”，缺乏成熟心智与自我。在养育过程中，他们难以将女儿视为独立个体，导致女儿沦为被凝视的客体、承担角色倒置，并陷入深度共生。文章旨在理解这一复杂代际创伤现象，并为受困扰的女性提供自我疗愈的视角与建议。\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/326421b9-295d-4be9-8854-a42fa8686bb8.pdf\",\"pdfHash\":\"8bce8df94e4364fbbb2bb7652464a45ac12dc00ad85ee2465f2a0debf166dd9f\",\"pendingCoverUrl\":null,\"category\":\"心理学\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":true,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":24,\"popularity\":44,\"rating\":0,\"aoiScore\":0,\"aiRigor\":0,\"aiReproducibility\":0,\"aiStandardization\":0,\"aiProfessionalism\":0,\"aiObjectivity\":0,\"createdAt\":\"$D2026-03-18T23:56:51.712Z\",\"updatedAt\":\"$D2026-03-29T09:54:06.772Z\",\"uploaderId\":\"cmmdy9nri002o4tcc0asg07vs\",\"uploaderIp\":\"::ffff:209.94.142.134\",\"journalId\":\"cmmdy9nr8002m4tcceuuashja\",\"conferenceId\":null},{\"id\":\"cmmhu06j600122gpayr57i7cw\",\"title\":\"矿石病抑制剂多策略优化研究:双特异性抗体靶向修饰、源石趋化 性纳米载体构建与分型靶向改造的协同增效\",\"author\":\"int_tracts\",\"correspondingAuthor\":\"int_tracts\",\"extraAuthors\":\"[{\\\"name\\\":\\\"int_tracts\\\",\\\"unit\\\":\\\"浙北化工大学\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"lxycindy73@163.com\\\"}]\",\"description\":\"矿石病(oripathy)\\r\\n,又称“多发性源石感染综合征”\\r\\n,是一种由活性源石感染造成的恶\\r\\n性传染病。患者在感染后身体逐渐结晶化,最终死亡并引发崩解现象,在数分钟到半小时\\r\\n内将大量源石微粒散布到周围的环境中,形成新的传染源。矿石病感染途径多样、难以有\\r\\n效防控,不仅严重危害泰拉公民的身体健康,而且引发了感染者与非感染者的阵营对立,\\r\\n加剧了社会动荡、阶级分化和人权问题。然而,与之对应的是,临床上现有的急性感染抑\\r\\n制剂仅能暂时抑制矿石病恶化,不能阻止疾病进展,且注射后有明显不良反应,药代动力\\r\\n学缺陷,需频繁给药。当前矿石病针对性治疗的关注点集中在降低活性源石与细胞结构的\\r\\n结合程度上。根据一些矿石病抑制剂开发者提供的说明,急性感染抑制剂能够封闭具有活\\r\\n性的多重结构晶体外壳的部分点位,阻止活性化源石内部的能量断裂后向外逸散。\\r\\n有鉴于此,本项目拟从急性感染抑制剂出发,开展结构改造与性能优化,发展活性优\\r\\n异、毒性可控、生物利用度高的新型药剂。\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/9a671c48-f008-426a-b797-db61706f24dd.pdf\",\"pdfHash\":\"dd6113a65095a9bbf0b73dc278c7c69c9d577155034a061cee8dc9cfc47b0ff4\",\"pendingCoverUrl\":null,\"category\":\"哲学\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":false,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":8,\"popularity\":8,\"rating\":0,\"aoiScore\":0,\"aiRigor\":0,\"aiReproducibility\":0,\"aiStandardization\":0,\"aiProfessionalism\":0,\"aiObjectivity\":0,\"createdAt\":\"$D2026-03-08T14:12:23.441Z\",\"updatedAt\":\"$D2026-03-13T09:00:57.869Z\",\"uploaderId\":\"cmlqbdmp5000mi51ucjuawoz1\",\"uploaderIp\":\"::ffff:171.8.225.88\",\"journalId\":\"cmlqbdmo90006i51u23q1mzzf\",\"conferenceId\":null},{\"id\":\"cmmtyd1rm008tkawt7cwilgxo\",\"title\":\"攻/受是一种体位？不，攻/受是一种处境：解构公嬤文化背后的压迫性框架与结构性困境\",\"author\":\"Ouroboros\",\"correspondingAuthor\":\"Ouroboros\",\"extraAuthors\":\"[{\\\"name\\\":\\\"Ouroboros\\\",\\\"unit\\\":\\\"N/A\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\" Pronoia，Neflibata，摸鱼\\\"}]\",\"description\":\"“你是公公还是嬤嬤？”\\r\\n这个问题在同人圈已从简单偏好演变为需要站队、自证、互相攻击的身份战争。公公占据舆论高地却长期失语，嬤嬤虽数量碾压、文化主导，却持续被污名化为猎奇。\\r\\n本文揭示：这些异化并非偶然，而是传统性别叙事在亚文化中占据主导的必然结果。公公推崇纯粹的男性权力到可以接受阳痿攻，嬤嬤将被插入视为奖赏到催生mob文。双方都未能逃离传统性\\r\\n别叙事。\\r\\n公公模仿父权制度，却为了维护一个没有实际权力的脆弱象征，被消耗在无限的党同伐异中。嬤嬤自称女权、反凝视，却仍将被插入视作叙事的核心元素；嘲讽公公是攻梦女，预设女性只能代入被插入方；用“你骂我我就嬤你家攻”来反击，恰恰说明嬤是一种贬低。双方都在无尽的自我防御和互相攻击中被消耗。\\r\\n借鉴弗莱雷和康奈尔的理论：在主流文化中缺乏非二元的性叙事工具，亚文化群体只能挪用传统性别政治这一压迫性框架。结果是女性被引导互相攻击，双方陷入防御性的身份焦虑，争论焦点从“你喜欢什么”转变为“你认同什么身份”。\\r\\n当越来越荒诞的标准出现，“攻嬤”的诞生标志着定义的彻底瓦解。结合巴特勒的理论：公嬤已从对偏好的描述转变为需要不断做出来的身份，而这种表演是为了掩盖本质并不存在的虚空。攻受不再是一种体位，而是一种处境——一个需要不断自证、永远焦虑、永无宁日的处境。\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/3852599f-3310-4dca-9911-75a2547758b1.pdf\",\"pdfHash\":\"b10373ffbca7a05ff61beab1d1cd0fd7479428c0c91a3146fe6bec4fb1af197d\",\"pendingCoverUrl\":null,\"category\":\"心理学\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":true,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":17,\"popularity\":23,\"rating\":0,\"aoiScore\":8144.64,\"aiRigor\":7,\"aiReproducibility\":4,\"aiStandardization\":6,\"aiProfessionalism\":8,\"aiObjectivity\":6,\"createdAt\":\"$D2026-03-17T01:47:36.370Z\",\"updatedAt\":\"$D2026-03-26T22:03:06.463Z\",\"uploaderId\":\"cmmdy9nri002o4tcc0asg07vs\",\"uploaderIp\":\"::ffff:209.94.142.134\",\"journalId\":\"cmmdy9nr8002m4tcceuuashja\",\"conferenceId\":null},{\"id\":\"cmmgep0e800dz4tcc9bm6mj14\",\"title\":\"咖啡因的超量制取\",\"author\":\"Hermann Ma--Pharmacy\",\"correspondingAuthor\":\"Hermann Ma--Pharmacy\",\"extraAuthors\":\"[{\\\"name\\\":\\\"Hermann Ma--Pharmacy\\\",\\\"unit\\\":\\\"\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"Hermann Ma--Pharmacy\\\"}]\",\"description\":\"作者颠覆了传统茶叶制取咖啡因的工序，超量产出产物\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/4d36f81e-f6fa-4ae9-883f-3fd92e31ccaf.pdf\",\"pdfHash\":\"0a7a62c12b8a77f6b6cad14788e45bb0d4ea477fc3dab98a5f2b52b1bd6e09bc\",\"pendingCoverUrl\":null,\"category\":\"rubbish\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":false,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":9,\"popularity\":9,\"rating\":0,\"aoiScore\":0,\"aiRigor\":0,\"aiReproducibility\":0,\"aiStandardization\":0,\"aiProfessionalism\":0,\"aiObjectivity\":0,\"createdAt\":\"$D2026-03-07T14:16:01.855Z\",\"updatedAt\":\"$D2026-03-19T07:06:43.804Z\",\"uploaderId\":\"cmmgebeen00dr4tccu4yvekx6\",\"uploaderIp\":\"::ffff:218.94.133.183\",\"journalId\":\"cmmgebeei00dp4tcc5520j4b5\",\"conferenceId\":null},{\"id\":\"cmmga7ns300cb4tccvdqs13k4\",\"title\":\"性别叙事与文学生态的双重审视——贾平凹创作伦理问题刍议\",\"author\":\"匿名, 《文学鉴史》编辑部\",\"correspondingAuthor\":\"《文学鉴史》编辑部\",\"extraAuthors\":\"[{\\\"name\\\":\\\"匿名\\\",\\\"unit\\\":\\\"\\\",\\\"roles\\\":[]},{\\\"name\\\":\\\"《文学鉴史》编辑部\\\",\\\"unit\\\":\\\"\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"wenxuejianshi@126.com\\\"}]\",\"description\":\"本文以贾平凹的创作实践为研究对象，对其作品中的性别书写及其言论引发的伦理争议进行学术性考察。通过分析贾平凹在多部作品中的女性形象塑造方式，并结合其“如果不买卖妇女的话，村子就灭亡了”这一言论的语境与影响，本文试图揭示当代文学生产中作家伦理立场与文学成就之间的复杂张力。研究发现，贾平凹的创作呈现出某种“性别盲视”特征，其对乡村社会结构的自然主义描摹，在缺乏足够反思性距离的情况下，可能转化为对某些落后性别秩序的潜在背书。同时，本文对围绕贾平凹及其女儿贾浅浅所形成的文学生产关系网络进行初步探讨，分析“文学代际传承”与“圈子认同”对文学评价体系的影响机制。\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/0b0ac72b-ec52-4f7e-ae08-ce02bd61a325.pdf\",\"pdfHash\":\"6a56d71beae16e724a23b257a57cd378e715a81f8535e2e762594b639b0c76ff\",\"pendingCoverUrl\":null,\"category\":\"汉语言文学\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":false,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":17,\"popularity\":14,\"rating\":0,\"aoiScore\":0,\"aiRigor\":0,\"aiReproducibility\":0,\"aiStandardization\":0,\"aiProfessionalism\":0,\"aiObjectivity\":0,\"createdAt\":\"$D2026-03-07T12:10:33.890Z\",\"updatedAt\":\"$D2026-03-24T03:28:14.480Z\",\"uploaderId\":\"cmm2ss5q6000us0jm08smu0ca\",\"uploaderIp\":\"::ffff:117.152.93.3\",\"journalId\":\"cmm2srgo7000ss0jmu0iua4qk\",\"conferenceId\":null},{\"id\":\"cmmlk51cm001lai2ypewnsos0\",\"title\":\"“兄弟们”与“被隐身的姐妹”：网络公共言说中的性别排斥与身份认同\",\"author\":\"一个sis\",\"correspondingAuthor\":\"一个sis\",\"extraAuthors\":\"[{\\\"name\\\":\\\"一个sis\\\",\\\"unit\\\":\\\"擦亮眼睛局, 眼镜店\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"N/A\\\"}]\",\"description\":\"本文聚焦于网络公共空间中一个看似细微却意味深长的语言现象：一位因报道年轻学者活动而成名的男博主，在其视频中高频使用“兄弟们”称呼观众，引发评论区女性观众“还有姐妹们”的提醒式纠错。本文以这一事件为切入点，运用女性主义语言学和批判性话语分析的理论框架，探讨“兄弟们”这一称呼语背后的性别政治。研究发现，这种看似无意识的口头禅，实则折射出网络言说中“男性=默认人类”的深层偏见，它通过语言惯例将女性置于“他者”和“被隐身”的境地。而女性观众的“纠错”行为，则构成了对语言命名权的争夺，是在线身份认同建构与争取话语可见性的重要实践。本文旨在揭示语言如何参与社会性别结构的塑造，并反思构建更具包容性的网络公共对话空间的可能性。\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/80fbf15e-a068-420c-8bc8-7c5e6f11d71e.pdf\",\"pdfHash\":\"3bf2e13cee295b78fd0610bff691dbc028fcfe5448239aa61fa4162ae785f1ce\",\"pendingCoverUrl\":null,\"category\":\"心理学\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":true,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":19,\"popularity\":26,\"rating\":0,\"aoiScore\":0,\"aiRigor\":0,\"aiReproducibility\":0,\"aiStandardization\":0,\"aiProfessionalism\":0,\"aiObjectivity\":0,\"createdAt\":\"$D2026-03-11T04:47:18.549Z\",\"updatedAt\":\"$D2026-03-28T07:06:47.495Z\",\"uploaderId\":\"cmmdy9nri002o4tcc0asg07vs\",\"uploaderIp\":\"::ffff:209.94.142.134\",\"journalId\":\"cmmdy9nr8002m4tcceuuashja\",\"conferenceId\":null},{\"id\":\"cmmhr78lr000m2gpa6beuj3yi\",\"title\":\"色彩的内化：从梵高画作配色逻辑论其异食行为的心理机制\",\"author\":\"果泡柚\",\"correspondingAuthor\":\"果泡柚\",\"extraAuthors\":\"[{\\\"name\\\":\\\"果泡柚\\\",\\\"unit\\\":\\\"臆术与设计\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"果泡柚\\\"}]\",\"description\":\"文森特•梵高（Vincent van Gogh）晚年的异食行为（吞食颜料）常被简单归结为精神失常。然而，若从其画作的配色逻辑与色彩心理学角度审视，这种行为表现出一种极端的艺术心理代偿。本文论证，梵高对特定高饱和度色彩（尤其是铬黄）的病态追求，使其不再满足于色彩的视觉呈现，而是试图通过“物理摄入”的方式实现色彩与自我的终极融合，从而在配色层面上完成了一种病态的“内化”仪式。\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/03b552eb-7dfa-46f5-a157-238b3613efd0.pdf\",\"pdfHash\":\"5c7ae361f4848551955f399f01711f0172ab2e122be746c5f805c32248cfd4c8\",\"pendingCoverUrl\":null,\"category\":\"美术学、设计学\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":false,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":22,\"popularity\":21,\"rating\":0,\"aoiScore\":0,\"aiRigor\":0,\"aiReproducibility\":0,\"aiStandardization\":0,\"aiProfessionalism\":0,\"aiObjectivity\":0,\"createdAt\":\"$D2026-03-08T12:53:53.869Z\",\"updatedAt\":\"$D2026-03-24T07:30:11.255Z\",\"uploaderId\":\"cmmfuqnol009f4tcctvsbcq8d\",\"uploaderIp\":\"::ffff:220.198.247.231\",\"journalId\":\"cmmfuqnoe009d4tcctocr4fah\",\"conferenceId\":null},{\"id\":\"cmmkykzpn0014ai2y5qbuf533\",\"title\":\"精神洁癖？少女暴君！——从玛丽苏小说、种马文学、晋江文学城的“双洁”叙事到《某某宗女修修炼手札》\",\"author\":\"Rain no White\",\"correspondingAuthor\":\"Rain no White\",\"extraAuthors\":\"[{\\\"name\\\":\\\"Rain no White\\\",\\\"unit\\\":\\\"995995\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"404\\\"}]\",\"description\":\"本文想讨论一种不太好认真命名、但又确实广泛存在的东西：精神洁癖。这里说的“精神洁癖”不是临床诊断，也不是严格的心理学术语，而更接近一种非临床的关系心理倾向：介意前任，介意白月光，介意“不是第一次”“不是唯一”“不是专门留给我的”，明明知道现实不可能像小说那样干净，心里还是会膈应。本文认为，这种心理倾向并不只是传统贞洁观的残余，也不只是个体性格问题，而和一代人的网络文学阅读经验关系很大。从早年的玛丽苏小说、公主文、隐藏身份文，到后来流行的升级流、逆袭流、种马文学，再到晋江文学城中的“双洁”“纯爱”“白月光焦虑”，这些看起来彼此不太看得起的文本，其实都在反复培养一种共同的心理底板：主角感。人会慢慢相信，自己不该拿普通配置的人生，也不该拿普通配置的爱情。本文材料主要来自广泛的社交媒体阅读、网络文学平台观察以及若干线下访谈。文章最后也讨论了这种精神洁癖为什么会开始松动：往往不是因为突然接受教育，而是因为见过更多人、更多故事、更多复杂关系之后，才逐渐意识到，纯、首位、唯一和 1v1 并不是世界唯一的秩序。与此同时，新一代女频文本也已经开始主动改造旧有的关系模板与观看方式，这表明所谓“精神洁癖”并非不可动摇，而是会随着文本经验与关系认知的扩展而发生变化。\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/7ca2009d-6233-49fb-887c-18524bae61be.pdf\",\"pdfHash\":\"b7fad15fc25e14de7d6a76e40b563bd2d3bbabb4174dd23227ace3bf19fe0d74\",\"pendingCoverUrl\":null,\"category\":\"心理学\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":true,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":24,\"popularity\":22,\"rating\":0,\"aoiScore\":4454.1,\"aiRigor\":6,\"aiReproducibility\":3,\"aiStandardization\":5,\"aiProfessionalism\":7,\"aiObjectivity\":7,\"createdAt\":\"$D2026-03-10T18:43:51.370Z\",\"updatedAt\":\"$D2026-03-27T05:39:28.673Z\",\"uploaderId\":\"cmmdy9nri002o4tcc0asg07vs\",\"uploaderIp\":\"::ffff:209.94.142.134\",\"journalId\":\"cmmdy9nr8002m4tcceuuashja\",\"conferenceId\":null}]}]}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[97291,[\"/_next/static/chunks/fb2ff57bae076136.js\",\"/_next/static/chunks/c022a629a3161d5a.js\"],\"IconMark\"]\n10:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"OpenJunk\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"OpenJunk - 全球领先的垃圾刊物公开平台\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"3\",{}]]\n"])</script></body></html>
