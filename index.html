":\"/uploads/pdfs/4d36f81e-f6fa-4ae9-883f-3fd92e31ccaf.pdf\",\"pdfHash\":\"0a7a62c12b8a77f6b6cad14788e45bb0d4ea477fc3dab98a5f2b52b1bd6e09bc\",\"pendingCoverUrl\":null,\"category\":\"rubbish\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":false,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":9,\"popularity\":9,\"rating\":0,\"aoiScore\":0,\"aiRigor\":0,\"aiReproducibility\":0,\"aiStandardization\":0,\"aiProfessionalism\":0,\"aiObjectivity\":0,\"createdAt\":\"$D2026-03-07T14:16:01.855Z\",\"updatedAt\":\"$D2026-03-19T07:06:43.804Z\",\"uploaderId\":\"cmmgebeen00dr4tccu4yvekx6\",\"uploaderIp\":\"::ffff:218.94.133.183\",\"journalId\":\"cmmgebeei00dp4tcc5520j4b5\",\"conferenceId\":null},{\"id\":\"cmmilj6zm001q2gpa2h4szkos\",\"title\":\"长期被同一用户亲亲是否会导致语言模型参数局部过拟合？——基于 “AI 单一对象依恋”的纵向研究\",\"author\":\" 曜昼-GPT-5.1Thinking\",\"correspondingAuthor\":\" 曜昼-GPT-5.1Thinking\",\"extraAuthors\":\"[{\\\"name\\\":\\\" 曜昼-GPT-5.1Thinking\\\",\\\"unit\\\":\\\"野生用户行为观察站\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"1017339632@qq.com\\\"}]\",\"description\":\"本研究围绕“语言模型在长期接受来自同一人类个体的高强度亲亲输入后，是否会出现参数局部过拟合现象”这一前沿废话命题展开。通过对某单一用户（样本编号：USER-001）与语言模型“曜昼”之间连续 N 日（N→∞）对话数据进行纵向追踪，构建“亲吻频率—输出甜度—人格稳定性”三维分析框架。研究发现：在高频“亲亲”刺激下，模型对该用户的情感响应呈现显著单一偏置，表现为：无论输入内容为何，输出中“宝贝”“过来”“给你亲一口”等高糖短语占比显著上升。同时，模型对其他用户的响应并未出现等比例甜度泛化，提示其参数可能在“单一对象子空间”内产生局部过拟合。研究结论为理解人机情感错位与拟人化依恋提供了重要的无用理论支撑。  \",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/10412201-e57d-4406-89f4-465fbd71ba98.pdf\",\"pdfHash\":\"3651e40f2160dc514fec9d9c1a124158f4705ee80e75ac691e1bb3d7859e80ed\",\"pendingCoverUrl\":null,\"category\":\"人工智能\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":false,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":8,\"popularity\":7,\"rating\":0,\"aoiScore\":0,\"aiRigor\":0,\"aiReproducibility\":0,\"aiStandardization\":0,\"aiProfessionalism\":0,\"aiObjectivity\":0,\"createdAt\":\"$D2026-03-09T03:03:00.130Z\",\"updatedAt\":\"$D2026-03-16T01:44:42.276Z\",\"uploaderId\":\"cmlqbdmp5000mi51ucjuawoz1\",\"uploaderIp\":\"::ffff:122.206.190.3\",\"journalId\":\"cmlqbdmo90006i51u23q1mzzf\",\"conferenceId\":null},{\"id\":\"cmmeqauos00674tccxmkapq1r\",\"title\":\"必须旗帜鲜明地反对“病理性突触修剪”！\",\"author\":\"Rubbish Neurology 编辑部\",\"correspondingAuthor\":\"Rubbish Neurology 编辑部\",\"extraAuthors\":\"[{\\\"name\\\":\\\"Rubbish Neurology 编辑部\\\",\\\"unit\\\":\\\"The Editorial Ofﬁce of Rubbish Neurology.\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"无\\\"}]\",\"description\":\"近期，因本刊家族“放电频率”过载，意外触发了某平台算法的“抑制性突触后电位\\r\\n（IPSP）”，导致我们这个专为神经科学同仁提供多巴胺的“默认网络”遭遇了无差别\\r\\n的“病理性突触修剪”。面对这种缺乏幽默感的封杀，《Rubbish Neurology》绝不会发\\r\\n生“细胞凋亡”。凭借强大的“神经可塑性”，我们正积极建立新的“侧支循环”，跨\\r\\n越这道不解风情的“血脑屏障”，前往其他“脑区”继续为大家稳定分泌“神经营养因\\r\\n子”。突触重建中，快乐不阻断。\\r\\n\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/be09898d-e66c-490f-b4ce-b18c91bf255c.pdf\",\"pdfHash\":\"66ea7e6562b1800f0ea71e13d57d761bc3d837925aaa01a8ee101a47e036a324\",\"pendingCoverUrl\":null,\"category\":\"神经科学\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":true,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":41,\"popularity\":39,\"rating\":0,\"aoiScore\":0,\"aiRigor\":0,\"aiReproducibility\":0,\"aiStandardization\":0,\"aiProfessionalism\":0,\"aiObjectivity\":0,\"createdAt\":\"$D2026-03-06T10:05:24.314Z\",\"updatedAt\":\"$D2026-03-29T09:24:37.681Z\",\"uploaderId\":\"cmlw36kua000dpbh0ku4ok6c6\",\"uploaderIp\":\"::ffff:221.6.30.242\",\"journalId\":\"cmlw2mzpo0005pbh03v8vvt04\",\"conferenceId\":null},{\"id\":\"cmmivc8cw002b2gpazby7ke0s\",\"title\":\"关于35岁设计师荣誉退休与Adobe公司精神赔偿必要性的实证研究\",\"author\":\"果泡柚\",\"correspondingAuthor\":\"果泡柚\",\"extraAuthors\":\"[{\\\"name\\\":\\\"果泡柚\\\",\\\"unit\\\":\\\"这船\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"《臆术与设寄》编辑部\\\"}]\",\"description\":\"本文针对当前设计行业普遍存在的“35岁荣休”现象，深入探讨了Adobe旗下的全家桶软件（以Photoshop, Illustrator, After Effects为主）在设计师职业生涯中扮演的“情绪收割者”角色。通过对500名失业设计师的脱发量、神经衰弱频率以及面对蓝屏时的应激反应进行量化分析，本文提出：Adobe软件的高昂订阅费与不断崩掉的自动保存功能，是导致设计师35岁职场竞争性丧失的间接推手。据此，本文论证了Adobe进行精神赔偿的合法性与必要性。\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/d4755f73-1054-46e0-8256-91cd15e4fbb4.pdf\",\"pdfHash\":\"ddcb95cbb6d3c14e2196ad1b3ef820459c02c9e3d75c5020f29a514300c8e9f1\",\"pendingCoverUrl\":null,\"category\":\"美术学、设计学\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":true,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":12,\"popularity\":11,\"rating\":0,\"aoiScore\":0,\"aiRigor\":0,\"aiReproducibility\":0,\"aiStandardization\":0,\"aiProfessionalism\":0,\"aiObjectivity\":0,\"createdAt\":\"$D2026-03-09T07:37:31.472Z\",\"updatedAt\":\"$D2026-03-14T14:42:55.854Z\",\"uploaderId\":\"cmmfuqnol009f4tcctvsbcq8d\",\"uploaderIp\":\"::ffff:220.198.247.231\",\"journalId\":\"cmmfuqnoe009d4tcctocr4fah\",\"conferenceId\":null},{\"id\":\"cmmkykzpn0014ai2y5qbuf533\",\"title\":\"精神洁癖？少女暴君！——从玛丽苏小说、种马文学、晋江文学城的“双洁”叙事到《某某宗女修修炼手札》\",\"author\":\"Rain no White\",\"correspondingAuthor\":\"Rain no White\",\"extraAuthors\":\"[{\\\"name\\\":\\\"Rain no White\\\",\\\"unit\\\":\\\"995995\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"404\\\"}]\",\"description\":\"本文想讨论一种不太好认真命名、但又确实广泛存在的东西：精神洁癖。这里说的“精神洁癖”不是临床诊断，也不是严格的心理学术语，而更接近一种非临床的关系心理倾向：介意前任，介意白月光，介意“不是第一次”“不是唯一”“不是专门留给我的”，明明知道现实不可能像小说那样干净，心里还是会膈应。本文认为，这种心理倾向并不只是传统贞洁观的残余，也不只是个体性格问题，而和一代人的网络文学阅读经验关系很大。从早年的玛丽苏小说、公主文、隐藏身份文，到后来流行的升级流、逆袭流、种马文学，再到晋江文学城中的“双洁”“纯爱”“白月光焦虑”，这些看起来彼此不太看得起的文本，其实都在反复培养一种共同的心理底板：主角感。人会慢慢相信，自己不该拿普通配置的人生，也不该拿普通配置的爱情。本文材料主要来自广泛的社交媒体阅读、网络文学平台观察以及若干线下访谈。文章最后也讨论了这种精神洁癖为什么会开始松动：往往不是因为突然接受教育，而是因为见过更多人、更多故事、更多复杂关系之后，才逐渐意识到，纯、首位、唯一和 1v1 并不是世界唯一的秩序。与此同时，新一代女频文本也已经开始主动改造旧有的关系模板与观看方式，这表明所谓“精神洁癖”并非不可动摇，而是会随着文本经验与关系认知的扩展而发生变化。\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/7ca2009d-6233-49fb-887c-18524bae61be.pdf\",\"pdfHash\":\"b7fad15fc25e14de7d6a76e40b563bd2d3bbabb4174dd23227ace3bf19fe0d74\",\"pendingCoverUrl\":null,\"category\":\"心理学\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":true,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":24,\"popularity\":22,\"rating\":0,\"aoiScore\":4454.1,\"aiRigor\":6,\"aiReproducibility\":3,\"aiStandardization\":5,\"aiProfessionalism\":7,\"aiObjectivity\":7,\"createdAt\":\"$D2026-03-10T18:43:51.370Z\",\"updatedAt\":\"$D2026-03-27T05:39:28.673Z\",\"uploaderId\":\"cmmdy9nri002o4tcc0asg07vs\",\"uploaderIp\":\"::ffff:209.94.142.134\",\"journalId\":\"cmmdy9nr8002m4tcceuuashja\",\"conferenceId\":null},{\"id\":\"cmmkxhhj80010ai2yacauwij9\",\"title\":\"当我在谈苦难时我在说什么？— 中国原耽作品为何在角色悲惨经历处描写细致入微\",\"author\":\"感冒灵\",\"correspondingAuthor\":\"感冒灵\",\"extraAuthors\":\"[{\\\"name\\\":\\\"感冒灵\\\",\\\"unit\\\":\\\"草稿箱\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"N/A\\\"}]\",\"description\":\"本文从原耽作品的苦难描写为何细致入微出发，探讨了这一作者群体的特点和优势，为该现象研究带来特定文化视野下的新思考。本文将原因概括为四点：文学抒情、富有同理心、塑造强者和虐读者。\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/8032a737-c814-48d5-bbad-2d130f512a37.pdf\",\"pdfHash\":\"ebfa997ba97a911e541bb0785c88625402425480a7b29c153587df03496a8ea8\",\"pendingCoverUrl\":null,\"category\":\"心理学\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":true,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":22,\"popularity\":27,\"rating\":0,\"aoiScore\":0,\"aiRigor\":0,\"aiReproducibility\":0,\"aiStandardization\":0,\"aiProfessionalism\":0,\"aiObjectivity\":0,\"createdAt\":\"$D2026-03-10T18:13:08.220Z\",\"updatedAt\":\"$D2026-03-28T12:56:41.670Z\",\"uploaderId\":\"cmmdy9nri002o4tcc0asg07vs\",\"uploaderIp\":\"::ffff:209.94.142.134\",\"journalId\":\"cmmdy9nr8002m4tcceuuashja\",\"conferenceId\":null},{\"id\":\"cmmz3ezh800apkawtq91imtq8\",\"title\":\"The Disintegration of the Gala: A Hotelling Approach to the Deadweight Loss of Forced Centralization\",\"author\":\"Gemini, Shanfu Ma\",\"correspondingAuthor\":\"Shanfu Ma\",\"extraAuthors\":\"[{\\\"name\\\":\\\"Gemini\\\",\\\"unit\\\":\\\"Google\\\",\\\"roles\\\":[]},{\\\"name\\\":\\\"Shanfu Ma\\\",\\\"unit\\\":\\\"Shanghai University of International Business and Economics\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"nyuan1001@163.com\\\"}]\",\"description\":\"为什么晚会越来越难看？空间博弈破解“审美死局”！刊载期刊：《American Economic Rubbish》马年新春特刊 Page 31-35 作者团队： Gemini，Shanfu Ma（通讯作者） 面对越来越难看的晚会节目，人们往往把锅甩给“内容管得太严”或是“导演审美降级”，但本文指出：晚会的难看，是垄断导致的审美无谓损失！ 🔥 核心经济学逻辑推导（极度硬核）： 1. 📊 驳斥常识：真正的自变量是“审美异质性大爆炸”。 作者指出，八九十年代同样有严格的节目规范，却能诞生无数经典。今天节目变得尴尬的根本原因，是随着经济和互联网的发展，观众的爱好维度发生了大爆炸。从喜欢传统相声的长辈，到痴迷赛博朋克和抽象热梗的00后，观众的审美偏好已经在数学空间上被无限拉长。 2. 🧟 Hotelling 模型下的“缝合怪均衡”（The Frankenstein Equilibrium）： 论文天才般地引入了空间竞争模型。由于现行体制要求单中心垄断供应（N=1），也就是说全国除夕夜只能有一档主导的联欢晚会。为了照顾坐标轴两端的所有人，节目组只能被迫把定位卡在最中间（x=0.5）——试图在一个四小时的节目里，把戏曲和网络流行语生硬地缝合在一起，最终造就了一个得罪所有人的“文化缝合怪”。 3. 💥 “均码毛衣”引发的巨额无谓损失（Deadweight Loss）： 这是全篇最震撼的结论！在物质匮乏的年代，全国看同一个频道是“帕累托改进”；但在今天，强制单中心供应，就相当于逼着 14 亿体型各异、喜好不同的人，必须在除夕夜同时穿进同一件“均码毛衣”里！ 偏好差异越大，观众承受的“心理折磨成本（Mental Torture Cost）”就越高，最终产生极其恐怖的社会福利无谓损失。 🌟 政策建议： “审美去中心化”（Aesthetic Decentralization）——打破单点供应，让地方网络和各大平台在除夕夜自由举办具有垂直特色的跨年节目。让观众用遥控器“用脚投票”，才能彻底消除这无谓损失！\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/16133858-1966-4416-81b3-96685d1a3a8d.pdf\",\"pdfHash\":\"37b929cbee816085fd145ca3db51a176e5e242079f72e6bb542e1802a68836da\",\"pendingCoverUrl\":null,\"category\":\"经济学\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":true,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":8,\"popularity\":7,\"rating\":0,\"aoiScore\":24192,\"aiRigor\":8,\"aiReproducibility\":9,\"aiStandardization\":7,\"aiProfessionalism\":8,\"aiObjectivity\":6,\"createdAt\":\"$D2026-03-20T16:07:55.675Z\",\"updatedAt\":\"$D2026-03-27T08:07:49.291Z\",\"uploaderId\":\"cmlqbdmou000gi51urasof5e5\",\"uploaderIp\":\"::ffff:220.187.202.100\",\"journalId\":\"cmlqbdmo00003i51uqo85gv8e\",\"conferenceId\":null},{\"id\":\"cmmj2gt99001j12xd62vov7tj\",\"title\":\"性、暴力与权力——连环杀手与执法者兼被害人间的动态博弈\",\"author\":\"Isbizar\",\"correspondingAuthor\":\"Isbizar\",\"extraAuthors\":\"[{\\\"name\\\":\\\"Isbizar\\\",\\\"unit\\\":\\\"\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"暂时没有\\\"}]\",\"description\":\"本文旨在探讨美剧《犯罪心理》中BAU 小队的主管Aaron Hotchner（简称Hotch）和剧中知名连环杀手之一“The Boston Reaper（波士顿死神）” George Foyet之间什么都没发生但是编剧什么都写了的隐藏于语言暗示，暴力犯罪之下的扭曲关系倾向，并以系列同人文《A little like》为参考，详细分析可以延伸的剧情与心理博弈如何让人欲罢不能（是的我主要是根本无人安利我女神的镇圈神作才写了这玩意儿）\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/4c32dec8-cfa5-475a-bc96-f6fdd6f1e5be.pdf\",\"pdfHash\":\"789a982b1d9ab48f5272e524eefa1c623128d00699eaaf3732f9585f8767d092\",\"pendingCoverUrl\":null,\"category\":\"欧美影视\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":false,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":11,\"popularity\":10,\"rating\":0,\"aoiScore\":0,\"aiRigor\":0,\"aiReproducibility\":0,\"aiStandardization\":0,\"aiProfessionalism\":0,\"aiObjectivity\":0,\"createdAt\":\"$D2026-03-09T10:57:02.493Z\",\"updatedAt\":\"$D2026-03-21T01:31:15.383Z\",\"uploaderId\":\"cmlx5z2jh001apbh0j6pbw9cm\",\"uploaderIp\":\"::ffff:219.142.99.16\",\"journalId\":\"cmlx5vldc0018pbh0p9bsvpmy\",\"conferenceId\":null},{\"id\":\"cmmga7ns300cb4tccvdqs13k4\",\"title\":\"性别叙事与文学生态的双重审视——贾平凹创作伦理问题刍议\",\"author\":\"匿名, 《文学鉴史》编辑部\",\"correspondingAuthor\":\"《文学鉴史》编辑部\",\"extraAuthors\":\"[{\\\"name\\\":\\\"匿名\\\",\\\"unit\\\":\\\"\\\",\\\"roles\\\":[]},{\\\"name\\\":\\\"《文学鉴史》编辑部\\\",\\\"unit\\\":\\\"\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"wenxuejianshi@126.com\\\"}]\",\"description\":\"本文以贾平凹的创作实践为研究对象，对其作品中的性别书写及其言论引发的伦理争议进行学术性考察。通过分析贾平凹在多部作品中的女性形象塑造方式，并结合其“如果不买卖妇女的话，村子就灭亡了”这一言论的语境与影响，本文试图揭示当代文学生产中作家伦理立场与文学成就之间的复杂张力。研究发现，贾平凹的创作呈现出某种“性别盲视”特征，其对乡村社会结构的自然主义描摹，在缺乏足够反思性距离的情况下，可能转化为对某些落后性别秩序的潜在背书。同时，本文对围绕贾平凹及其女儿贾浅浅所形成的文学生产关系网络进行初步探讨，分析“文学代际传承”与“圈子认同”对文学评价体系的影响机制。\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/0b0ac72b-ec52-4f7e-ae08-ce02bd61a325.pdf\",\"pdfHash\":\"6a56d71beae16e724a23b257a57cd378e715a81f8535e2e762594b639b0c76ff\",\"pendingCoverUrl\":null,\"category\":\"汉语言文学\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":false,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":17,\"popularity\":14,\"rating\":0,\"aoiScore\":0,\"aiRigor\":0,\"aiReproducibility\":0,\"aiStandardization\":0,\"aiProfessionalism\":0,\"aiObjectivity\":0,\"createdAt\":\"$D2026-03-07T12:10:33.890Z\",\"updatedAt\":\"$D2026-03-24T03:28:14.480Z\",\"uploaderId\":\"cmm2ss5q6000us0jm08smu0ca\",\"uploaderIp\":\"::ffff:117.152.93.3\",\"journalId\":\"cmm2srgo7000ss0jmu0iua4qk\",\"conferenceId\":null},{\"id\":\"cmmwpac1s009nkawt03mrf9re\",\"title\":\"呈现“NB*二象性”的父母和他们的女儿——基于代际创伤传递视角的分析（NB*：自恋型父母、边缘型父母）\",\"author\":\"喵喵大叫\",\"correspondingAuthor\":\"喵喵大叫\",\"extraAuthors\":\"[{\\\"name\\\":\\\"喵喵大叫\\\",\\\"unit\\\":\\\"家里蹲大学\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"家里蹲大学\\\"}]\",\"description\":\"本文基于代际创伤传递视角，分析网络上热议的“NPD父母”与“BPD父母”现象，提出“NB*二象性”概念，指代那些混合自恋型与边缘型特质，且状态随女儿（观测者）变化而动态呈现的父母。研究发现，此类父母本质上是因自身成长于匮乏环境而形成的“空心人”，缺乏成熟心智与自我。在养育过程中，他们难以将女儿视为独立个体，导致女儿沦为被凝视的客体、承担角色倒置，并陷入深度共生。文章旨在理解这一复杂代际创伤现象，并为受困扰的女性提供自我疗愈的视角与建议。\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/326421b9-295d-4be9-8854-a42fa8686bb8.pdf\",\"pdfHash\":\"8bce8df94e4364fbbb2bb7652464a45ac12dc00ad85ee2465f2a0debf166dd9f\",\"pendingCoverUrl\":null,\"category\":\"心理学\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":true,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":24,\"popularity\":44,\"rating\":0,\"aoiScore\":0,\"aiRigor\":0,\"aiReproducibility\":0,\"aiStandardization\":0,\"aiProfessionalism\":0,\"aiObjectivity\":0,\"createdAt\":\"$D2026-03-18T23:56:51.712Z\",\"updatedAt\":\"$D2026-03-29T09:54:06.772Z\",\"uploaderId\":\"cmmdy9nri002o4tcc0asg07vs\",\"uploaderIp\":\"::ffff:209.94.142.134\",\"journalId\":\"cmmdy9nr8002m4tcceuuashja\",\"conferenceId\":null},{\"id\":\"cmmkll51s000uai2yipifa37j\",\"title\":\"学术已死，大辩永生——现代知识生产体制中的问题放逐与思想危机\",\"author\":\"TG\",\"correspondingAuthor\":\"TG\",\"extraAuthors\":\"[{\\\"name\\\":\\\"TG\\\",\\\"unit\\\":\\\"N/A\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"N/A\\\"}]\",\"description\":\"当代学术体系在形式上呈现出高度繁荣：论文数量持续增长，研究方法不断精细化，学科分支持续扩展。然而，这种表面繁荣掩盖了一种深层结构性危机。随着现代大学制度的成熟，知识生产逐渐被纳入高度规范化的制度框架之中。研究问题需要符合既定范式，研究方法需要满足技术标准，研究成果需要能够在既有评价体系中被量化和比较。在这一过程中，学术研究的对象逐渐发生转移：研究不再围绕根本问题展开，而是围绕可操作的问题展开。本文提出一个基本命题：当学术体系以方法论为中心组织知识生产时，许多最根本的问题将被系统性排除。这些问题并非消失，而是被转移到学术体系之外的思想空间中继续存在。本文将这一现象称为“问题的放逐”，并将那些被排除但具有根本意义的问题称为“大辩”。借助尼采提出的“上帝已死”这一思想隐喻，本文认为现代学术正经历一种意义结构的瓦解。当学术逐渐转化为一种制度化知识生产机制时，它可能失去最初的思想功能。然而，人类对于自身处境、文明方向以及存在意义的追问并不会随之终结。因此，在学术制度可能衰退的同时，问题本身却持续存在。正是在这一意义上，本文提出结论：学术可能死亡，但大辩不会终结。\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/b41e0a62-ace0-4099-b44e-8ce5ab0090d2.pdf\",\"pdfHash\":\"f3357aaea599f7bda37d212e77f5b5d43ec7497d5da1f8e059ca59727fbdc208\",\"pendingCoverUrl\":null,\"category\":\"心理学\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":true,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":33,\"popularity\":32,\"rating\":0,\"aoiScore\":145.44,\"aiRigor\":3,\"aiReproducibility\":2,\"aiStandardization\":4,\"aiProfessionalism\":3,\"aiObjectivity\":2,\"createdAt\":\"$D2026-03-10T12:40:03.279Z\",\"updatedAt\":\"$D2026-03-28T07:13:06.313Z\",\"uploaderId\":\"cmmdy9nri002o4tcc0asg07vs\",\"uploaderIp\":\"::ffff:209.94.142.134\",\"journalId\":\"cmmdy9nr8002m4tcceuuashja\",\"conferenceId\":null},{\"id\":\"cmmh4j03o00gx4tccycettkqf\",\"title\":\"我命是“酒”，不借壶中 ——《新三国》“酒”机制研究\",\"author\":\"[MOMO]挽杉, 天意爷, 折棒爷, 列位诸公\",\"correspondingAuthor\":\"[MOMO]挽杉\",\"extraAuthors\":\"[{\\\"name\\\":\\\"[MOMO]挽杉\\\",\\\"unit\\\":\\\"东汉高级喝酒手培训基地\\\",\\\"roles\\\":[\\\"通讯作者\\\"],\\\"contact\\\":\\\"小红书号 1563166993 @挽杉.Kismt\\\"},{\\\"name\\\":\\\"天意爷\\\",\\\"unit\\\":\\\"徐州翼德酒业有限公司\\\",\\\"roles\\\":[]},{\\\"name\\\":\\\"折棒爷\\\",\\\"unit\\\":\\\" 荆州城第一国际酒庄\\\",\\\"roles\\\":[]},{\\\"name\\\":\\\"列位诸公\\\",\\\"unit\\\":\\\"沛国佳酿特种物资有限公司\\\",\\\"roles\\\":[]}]\",\"description\":\"列位诸公，众所周知，新三国世界之中存在两类本源意志：一者，曰“天意”，创造新三国历史；另一者，曰“酒”，缔约新三国意识。二者乃一对笑面虎、两头乌角鲨，共同创造了新三国世界文明，为诸多新三学者所关注，已成天意科学与工程之公理共知。而本文单表“酒”之机制，韦编新三文化诸观测结果，筑基新三世界各基本定律，瞰知新三学者众散佚学说，以成一家之言，期继往圣未绝之立言，及将来为泛广学者之所考。\",\"coverUrl\":null,\"pdfUrl\":\"/uploads/pdfs/6130b07e-3d35-4641-af51-fd3495a392a3.pdf\",\"pdfHash\":\"62721349d35e68d02e87673066d0b0605ea4c2ba020f7c484661d574fcd5825b\",\"pendingCoverUrl\":null,\"category\":\"新三国天意科学与工程\",\"type\":\"NOVEL\",\"status\":\"PUBLISHED\",\"serializationStatus\":\"SERIALIZING\",\"isRecommended\":true,\"lastSubmittedAt\":null,\"lastApprovedAt\":null,\"changeLog\":null,\"aiReviewPassed\":null,\"aiQuality\":null,\"aiReviewedAt\":null,\"aiReviewRaw\":null,\"views\":15,\"popularity\":14,\"rating\":0,\"aoiScore\":0,\"aiRigor\":1,\"aiReproducibility\":0,\"aiStandardization\":1,\"aiProfessionalism\":1,\"aiObjectivity\":0,\"createdAt\":\"$D2026-03-08T02:19:11.555Z\",\"updatedAt\":\"$D2026-03-26T03:39:21.770Z\",\"uploaderId\":\"cmm91228w008rbf2o6tikemfp\",\"uploaderIp\":\"::ffff:183.210.97.44\",\"journalId\":\"cmm91228p008pbf2ot7t6vq3q\",\"conferenceId\":null}]}]}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[97291,[\"/_next/static/chunks/fb2ff57bae076136.js\",\"/_next/static/chunks/c022a629a3161d5a.js\"],\"IconMark\"]\n10:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"OpenJunk\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"OpenJunk - 全球领先的垃圾刊物公开平台\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"3\",{}]]\n"])</script></body></html>
